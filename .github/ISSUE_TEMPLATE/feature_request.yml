name: Feature request
description: Propose a scoped interaction or compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow or compatibility gap, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: extensions
    attributes:
      label: Relevant DSH Slots or extensions
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
